name: Update league history

on:
  schedule:
    # 09:00 America/Chicago = 14:00 UTC. Tuesdays, Sept through Jan only.
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to pull from ESPN"
        required: false
        default: "2026"
  push:
    branches: [main]
    paths: ["legacy.json", "index.html", "update_league.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SEASON: ${{ github.event.inputs.season || '2026' }}
  ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
  ESPN_S2: ${{ secrets.ESPN_S2 }}
  ESPN_SWID: ${{ secrets.ESPN_SWID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "espn-api>=0.45"

      - name: Skip out-of-season scheduled runs
        id: gate
        run: |
          MONTH=$(date -u +%m)
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ "$MONTH" -gt 01 ] && [ "$MONTH" -lt 09 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Off-season ($MONTH) - nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild data.json
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$ESPN_LEAGUE_ID" ]; then
            python update_league.py --season "$SEASON"
          else
            echo "No ESPN_LEAGUE_ID set - building from legacy.json only."
            python update_league.py
          fi

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "guts2glory-bot"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update standings $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Package site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
